name: Web flasher (GitHub Pages)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Versión publicada (ej. v1.2.3)
        required: true
        type: string

# Por defecto, solo lectura. Pages se despliega únicamente desde el job "deploy".
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node (only to download esp-web-tools at a pinned version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build locked production flight profile
        run: pio run -e ttgo-lora32-v1-flight

      - name: Generate web flasher site
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python tools/build_web_flasher.py \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --output site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build-site
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
