name: Firmware release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. v1.2.3)
        required: true
        type: string
      deploy_site:
        description: Also deploy the web flasher to GitHub Pages
        required: false
        default: true
        type: boolean

# Por defecto, solo lectura. El permiso de escritura se concede únicamente a los jobs que publican.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build locked production flight profile
        run: pio run -e ttgo-lora32-v1-flight -e ttgo-lora32-v21-flight

      - name: Package firmware bundles
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python tools/package_firmware_release.py \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --output release-assets

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error

  publish:
    needs: build-firmware
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: FlyWithMe ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/release-manifest.json

  # El flasheador web se despliega desde el MISMO build que la release. Antes era un workflow
  # aparte que recompilaba: las builds de ESP-IDF no son reproducibles byte a byte, asi que el
  # sitio acababa sirviendo un firmware.bin con un hash distinto del publicado en la release y
  # sus SHA256SUMS no cuadraban con el release-manifest.json. Reutilizar los binarios ya
  # empaquetados hace que coincidan por construccion.
  deploy-flasher:
    needs: build-firmware
    if: ${{ github.event_name == 'push' || inputs.deploy_site }}
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node (only to download esp-web-tools at a pinned version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Unpack the published firmware binaries
        run: |
          mkdir -p published
          for bundle in release-assets/FlyWithMe-*.zip; do
            board="$(basename "$bundle" .zip)"
            board="${board#FlyWithMe-*-}"
            mkdir -p "published/$board"
            unzip -q "$bundle" -d "published/$board"
            echo "  $board <- $(basename "$bundle")"
          done
          ls -1 published

      - name: Generate web flasher site from the published binaries
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python tools/build_web_flasher.py \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --binaries-root published \
            --output site

      # Las hashes del sitio deben ser identicas a las de cada manifest.json publicado en los zips.
      # Si divergen, el despliegue falla: es la garantia de que ambos canales sirven lo mismo.
      - name: Verify the site matches the published hashes
        run: |
          python tools/verify_site_hashes.py \
            --release-assets release-assets \
            --site site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
