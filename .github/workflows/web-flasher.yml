name: Web flasher (GitHub Pages)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Versión publicada (ej. v1.2.3)
        required: true
        type: string

# Por defecto, solo lectura. Pages se despliega únicamente desde el job "deploy".
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node (solo para descargar esp-web-tools con versión fijada)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build locked production flight profile
        run: pio run -e ttgo-lora32-v1-flight

      - name: Generate web flasher site
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python tools/build_web_flasher.py \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --output site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build-site
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
