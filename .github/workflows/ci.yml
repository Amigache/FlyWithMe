name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (flight and dev/HIL) and web flasher
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build flight and dev/HIL profiles
        run: pio run -e ttgo-lora32-v1-flight -e ttgo-lora32-v21-flight -e ttgo-lora32-v1-sitl

      - name: Check web flasher generation
        run: |
          python tools/build_web_flasher.py \
            --version ci-check \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/site-ci"

  native-tests:
    name: Unit tests (pio test -e native)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Run native tests
        run: pio test -e native

  python-tools:
    name: Python tools
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pyserial==3.5

      - name: Compile tools
        run: python -m py_compile tools/*.py tools/tests/*.py

      - name: Unit tests
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v

      - name: Software simulators
        run: |
          python tools/proto_sim.py
          python tools/follow_sim_test.py
