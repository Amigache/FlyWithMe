; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-lora32-v1]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
; Partición sin OTA: app 3 MB + SPIFFS 896 KB (el firmware actual ~1.13 MB no cabe con holgura
; en la partición por defecto de 1.25 MB).
board_build.partitions = huge_app.csv
; El cristal de la TTGO LoRa32 V1.0 es de 26 MHz. Sin esta flag el firmware asume 40 MHz:
; la UART sale x0.65 (~37440 en vez de 57600) y la WiFi/BT queda fuera de banda (no emite AP).
; El core de Arduino 3.x aplica F_XTAL_MHZ en app_main() antes de initArduino()/WiFi.
monitor_speed = 57600
monitor_port = COMx
upload_port = COMx
upload_speed = 115200
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit SSD1306@^2.5.9
	thijse/ArduinoLog@^1.1.1
	sandeepmistry/LoRa@^0.8.0
	esp32async/ESPAsyncWebServer@^3.12.1
	esp32async/AsyncTCP@^3.5.0
build_flags =
    -DF_XTAL_MHZ=26
	-std=c++17

; Imagen única para todos los aviones reales. El rol se provisiona en NVS después de cargarla.
[env:ttgo-lora32-v1-flight]
extends = env:ttgo-lora32-v1
build_flags = ${env:ttgo-lora32-v1.build_flags} -D FC_EMULATION=0 -D FC_LINK_USB=0

; Banco SITL: misma lógica de rol, transporte MAVLink por UART0, ajustes RF solo para pruebas.
[env:ttgo-lora32-v1-sitl]
extends = env:ttgo-lora32-v1
build_flags = ${env:ttgo-lora32-v1.build_flags} -D FC_LINK_USB=1 -D FC_EMULATION=0 -D MIN_SAFE_ALTITUDE=0 -D LORA_SPREADING_FACTOR=7 -D LORA_SIGNAL_BANDWIDTH=250000 -D SEND_PACKET_INTERVAL=200 -D ADAPTIVE_RATE=0
