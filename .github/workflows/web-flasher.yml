name: Web flasher (GitHub Pages)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Versión publicada (ej. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node (solo para descargar esp-web-tools con versión fijada)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build locked production flight profile
        run: pio run -e ttgo-lora32-v1-flight

      - name: Generate web flasher site
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python tools/build_web_flasher.py \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --output site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-site
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
