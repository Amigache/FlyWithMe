; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-lora32-v1-master]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
; Partición sin OTA: app 3 MB + SPIFFS 896 KB (el firmware actual ~1.13 MB no cabe con holgura
; en la partición por defecto de 1.25 MB).
board_build.partitions = huge_app.csv
; El cristal de la TTGO LoRa32 V1.0 es de 26 MHz. Sin esta flag el firmware asume 40 MHz:
; la UART sale x0.65 (~37440 en vez de 57600) y la WiFi/BT queda fuera de banda (no emite AP).
; El core de Arduino 3.x aplica F_XTAL_MHZ en app_main() antes de initArduino()/WiFi.
monitor_speed = 57600
monitor_port = COMx
upload_port = COMx
upload_speed = 115200
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit SSD1306@^2.5.9
	thijse/ArduinoLog@^1.1.1
	sandeepmistry/LoRa@^0.8.0
	esp32async/ESPAsyncWebServer@^3.12.1
	esp32async/AsyncTCP@^3.5.0
build_flags =
    -D MASTER_BUILD_FLAG=true
    -DF_XTAL_MHZ=26
	-std=c++17

[env:ttgo-lora32-v1-slave]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 57600
monitor_port = COMx
upload_port = COMx
upload_speed = 115200
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit SSD1306@^2.5.9
	thijse/ArduinoLog@^1.1.1
	sandeepmistry/LoRa@^0.8.0
	esp32async/ESPAsyncWebServer@^3.12.1
	esp32async/AsyncTCP@^3.5.0
build_flags =
    -D SLAVE_BUILD_FLAG=true
    -DF_XTAL_MHZ=26
	-std=c++17	

; --- Vuelo real ArduPlane: autopiloto por UART1 (GPIO12/13), sin telemetria sintetica ---
[env:ttgo-lora32-v1-master-flight]
extends = env:ttgo-lora32-v1-master
build_flags = ${env:ttgo-lora32-v1-master.build_flags} -D FC_EMULATION=0 -D FC_LINK_USB=0

[env:ttgo-lora32-v1-slave-flight]
extends = env:ttgo-lora32-v1-slave
build_flags = ${env:ttgo-lora32-v1-slave.build_flags} -D FC_EMULATION=0 -D FC_LINK_USB=0

; --- Pruebas con SITL: MAVLink por USB/UART0 (FC_LINK_USB=1, FC_EMULATION=0) ---
[env:ttgo-lora32-v1-master-sitl]
extends = env:ttgo-lora32-v1-master
; P3 banco: menor latencia (SF7+BW250k) y 5 Hz fijos
build_flags = ${env:ttgo-lora32-v1-master.build_flags} -D FC_LINK_USB=1 -D FC_EMULATION=0 -D LORA_SPREADING_FACTOR=7 -D LORA_SIGNAL_BANDWIDTH=250000 -D SEND_PACKET_INTERVAL=200 -D ADAPTIVE_RATE=0

[env:ttgo-lora32-v1-slave-sitl]
extends = env:ttgo-lora32-v1-slave
; SITL: el seguidor usa sysid=2 (tools/sitl/follower.parm -> SYSID_THISMAV 2), igual que en produccion.
; MIN_SAFE_ALTITUDE=0 permite validar la formacion en banco con el vehiculo SITL en el suelo.
build_flags = ${env:ttgo-lora32-v1-slave.build_flags} -D FC_LINK_USB=1 -D FC_EMULATION=0 -D MIN_SAFE_ALTITUDE=0 -D LORA_SPREADING_FACTOR=7 -D LORA_SIGNAL_BANDWIDTH=250000
