; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Sin default_envs, `pio run` y `pio run -t upload` procesan todos los entornos, incluido el de
; emulación de FC (ttgo-lora32-v1). El entorno de vuelo es el único por defecto.
[platformio]
default_envs = ttgo-lora32-v1-flight

[env:ttgo-lora32-v1]
; Plataforma fijada por URL: el fork pioarduino 55.03.37 (Arduino core 3.3.7). No existe en el registro
; oficial de PlatformIO, que solo tiene versiones 1.x-7.x de espressif32 (core 2.x). Actualizar de forma
; deliberada y recompilar ambos perfiles.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = ttgo-lora32-v1
framework = arduino
; Partición sin OTA: app 3 MB + SPIFFS 896 KB (el firmware actual ~1.13 MB no cabe con holgura
; en la partición por defecto de 1.25 MB).
board_build.partitions = huge_app.csv
; El cristal de la TTGO LoRa32 V1.0 es de 26 MHz. Sin esta flag el firmware asume 40 MHz:
; la UART sale x0.65 (~37440 en vez de 57600) y la WiFi/BT queda fuera de banda (no emite AP).
; El core de Arduino 3.x aplica F_XTAL_MHZ en app_main() antes de initArduino()/WiFi.
; Puertos COM: sin monitor_port/upload_port (PlatformIO detecta la placa). Para fijarlos usa
; --upload-port en la línea de comandos o tools/flash_firmware.py --port COMx.
monitor_speed = 57600
upload_speed = 115200
lib_deps = 
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@2.5.17
	adafruit/Adafruit BusIO@1.17.4
	thijse/ArduinoLog@1.1.1
	sandeepmistry/LoRa@0.8.0
	esp32async/ESPAsyncWebServer@3.12.1
	esp32async/AsyncTCP@3.5.0
build_flags =
    -DF_XTAL_MHZ=26
	-std=c++17

; Pruebas unitarias en host de los módulos puros de src/ (protocolo, STATUSTEXT, identidad WiFi, self-test).
; Ejecutar: pio test -e native. No compila el firmware ni depende de Arduino.
[env:native]
platform = native@1.2.1
build_flags = -std=c++17
test_build_src = no

; Imagen única para todos los aviones reales. El rol se provisiona en NVS después de cargarla.
[env:ttgo-lora32-v1-flight]
extends = env:ttgo-lora32-v1
build_flags = ${env:ttgo-lora32-v1.build_flags} -D FC_EMULATION=0 -D FC_LINK_USB=0 -D FWM_ALLOW_RUNTIME_SITL=0

; Imagen universal solo para desarrollo/HIL. Arranca como flight (UART1); FWM SIM ON cambia
; temporalmente a UART0 + perfil RF de banco. Incluye la guarda head-on para validar el escenario
; en SITL; producción mantiene HEAD_ON_GUARD=0. Un reset vuelve siempre a flight.
[env:ttgo-lora32-v1-sitl]
extends = env:ttgo-lora32-v1
build_flags = ${env:ttgo-lora32-v1.build_flags} -D FC_EMULATION=0 -D FC_LINK_USB=0 -D FWM_ALLOW_RUNTIME_SITL=1 -DHEAD_ON_GUARD=1
