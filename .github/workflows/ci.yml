name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (flight y dev/HIL) y flasheador web
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build flight and dev/HIL profiles
        run: pio run -e ttgo-lora32-v1-flight -e ttgo-lora32-v1-sitl

      - name: Check web flasher generation
        run: |
          python tools/build_web_flasher.py \
            --version ci-check \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/site-ci"

  native-tests:
    name: Pruebas unitarias (pio test -e native)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Run native tests
        run: pio test -e native

  python-tools:
    name: Herramientas Python
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependency
        run: python -m pip install pyserial==3.5

      - name: Compile tools
        run: python -m py_compile tools/*.py tools/tests/*.py

      - name: Unit tests
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v

      - name: Software simulators
        run: |
          python tools/proto_sim.py
          python tools/follow_sim_test.py
