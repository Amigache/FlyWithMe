name: Firmware release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Versión (ej. v1.2.3)
        required: true
        type: string

# Por defecto, solo lectura. El permiso de escritura se concede únicamente al job de publicación.
permissions:
  contents: read

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build locked production flight profile
        run: pio run -e ttgo-lora32-v1-flight

      - name: Package firmware bundles
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python tools/package_firmware_release.py \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --output release-assets

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error

  publish:
    needs: build-firmware
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: FlyWithMe ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/release-manifest.json
